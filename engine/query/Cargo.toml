# Foundation and runtime, like the command system -- and the command system
# itself, for the one identity model: who is asking (`Actor`), through which
# door (`Source`), and who may (`SourcePolicy`). A second definition of "an
# actor" would be two answers to one question. Nothing that knows what a world
# is: queries about the world are answered above, where the world is visible.
