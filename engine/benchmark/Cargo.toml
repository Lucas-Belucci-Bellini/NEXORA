[package]
name = "nexora-benchmark"
description = "NEXORA Phase 0 measurement harness: the reference numbers for the language selection gate."
version.workspace = true
edition.workspace = true
# Inherited from nexora-rhi-wgpu (wgpu 30) since the RHI stage (ADR-0026).
rust-version = "1.87"
license.workspace = true
repository.workspace = true

[lib]
name = "nexora_benchmark"
path = "src/lib.rs"

[[bin]]
name = "nexora-benchmark"
path = "src/main.rs"

# The window stage opens a real window, and the event loop must own the main
# thread, while the test harness runs tests on worker threads: this test is
# its own `main`.
[[test]]
name = "window_stage"
path = "tests/window_stage.rs"
harness = false

[dependencies]
nexora-foundation.workspace = true
nexora-runtime.workspace = true
nexora-persistence.workspace = true
nexora-world.workspace = true
nexora-entity.workspace = true
nexora-physics.workspace = true
nexora-mesh.workspace = true
nexora-camera.workspace = true
nexora-render.workspace = true
nexora-window.workspace = true
nexora-simulation.workspace = true
nexora-streaming.workspace = true
nexora-ffi-probe.workspace = true
nexora-rhi.workspace = true
nexora-rhi-wgpu.workspace = true

# The tool-call stage's fixture is read back by the engine's one PNG decoder
# (ADR-0022) in its tests; the stage itself does not decode it.
[dev-dependencies]
nexora-asset.workspace = true
nexora-image.workspace = true

[features]
# Link the C++ translation unit and measure the language boundary for real.
# Off by default so `cargo build --workspace` needs no C++ compiler; turned on
# by `scripts/compare-stacks.sh`.
cpp = ["nexora-ffi-probe/cpp"]

[lints]
workspace = true
