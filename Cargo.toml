# NEXORA workspace.
#
# Layout follows "ENGINE ARCHITECTURE AND TECHNOLOGY DECISION.md" §14: language
# boundaries are explicit directories, and the dependency direction documented in
# "NEXORA DEPENDENCY MATRIX.md" is enforced by the crate graph itself:
#
#     foundation  -> (nothing)
#     persistence -> foundation
#     runtime     -> foundation
#     asset       -> foundation, runtime
#     resource    -> foundation, asset
#     image       -> foundation, asset, resource
#     command     -> foundation, runtime
#     query       -> foundation, runtime, command
#     world       -> foundation, runtime, persistence
#     physics     -> foundation
#     streaming   -> foundation
#     mesh        -> foundation
#     camera      -> foundation   (view, projection, render origin; ADR-0029)
#     rhi         -> foundation
#     rhi-wgpu    -> foundation, rhi, wgpu   (the one external dependency, ADR-0026)
#     window      -> foundation, rhi, rhi-wgpu, winit   (the window host, ADR-0027)
#     simulation  -> foundation, runtime, asset, world, physics, streaming, command, query
#     headless    -> all of the above
#
# Outside engine/, over the public contracts only:
#     texture-forge -> foundation, asset, resource, image
#
# A crate cannot depend "upwards", because Cargo rejects cycles. The matrix is
# therefore checked by the build rather than by review alone.

[workspace]
resolver = "2"
members = [
    "engine/foundation",
    "engine/runtime",
    "engine/asset",
    "engine/resource",
    "engine/image",
    "engine/command",
    "engine/query",
    "engine/persistence",
    "engine/world",
    "engine/entity",
    "engine/physics",
    "engine/streaming",
    "engine/mesh",
    "engine/camera",
    "engine/rhi",
    "engine/rhi-wgpu",
    "engine/window",
    "engine/simulation",
    "engine/headless",
    "engine/benchmark",
    # Not an engine crate: a content tool, over the public asset contracts.
    "tools/texture-forge",
    # Not an engine crate: the only place `unsafe` is allowed, because measuring
    # a language boundary means calling across one. ADR-0009.
    "benchmarks/ffi-probe",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lucas-Belucci-Bellini/NEXORA"

[workspace.dependencies]
nexora-foundation = { path = "engine/foundation", version = "0.0.1" }
nexora-runtime = { path = "engine/runtime", version = "0.0.1" }
nexora-asset = { path = "engine/asset", version = "0.0.1" }
nexora-resource = { path = "engine/resource", version = "0.0.1" }
nexora-image = { path = "engine/image", version = "0.0.1" }
nexora-command = { path = "engine/command", version = "0.0.1" }
nexora-query = { path = "engine/query", version = "0.0.1" }
nexora-persistence = { path = "engine/persistence", version = "0.0.1" }
nexora-world = { path = "engine/world", version = "0.0.1" }
nexora-entity = { path = "engine/entity", version = "0.0.1" }
nexora-physics = { path = "engine/physics", version = "0.0.1" }
nexora-streaming = { path = "engine/streaming", version = "0.0.1" }
nexora-mesh = { path = "engine/mesh", version = "0.0.1" }
nexora-camera = { path = "engine/camera", version = "0.0.1" }
nexora-rhi = { path = "engine/rhi", version = "0.0.1" }
nexora-rhi-wgpu = { path = "engine/rhi-wgpu", version = "0.0.1" }
nexora-window = { path = "engine/window", version = "0.0.1" }
nexora-simulation = { path = "engine/simulation", version = "0.0.1" }
nexora-ffi-probe = { path = "benchmarks/ffi-probe", version = "0.0.1" }
nexora-texture-forge = { path = "tools/texture-forge", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
panic_in_result_fn = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
