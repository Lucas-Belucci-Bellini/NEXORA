# NEXORA continuous integration.
#
# Stage order follows "NEXORA BUILD CI AND RELEASE ARCHITECTURE.md". Stages that
# have no code to run yet (package, migration) are absent rather than stubbed
# green: a check that always passes is worse than a missing one, because it
# reads as coverage.

name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: format, lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version, so the action installs exactly it.
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          rustc --version && cargo --version

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # STAGE: FORMAT
      - name: Format
        run: cargo fmt --all --check

      # STAGE: LINT / STATIC ANALYSIS
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The native RHI backend's tests need a GPU and the runner has none, so
      # it gets Mesa's lavapipe: a conformant Vulkan driver, in software. The
      # tests fail rather than skip when no adapter answers (ADR-0026).
      # The window host's need a display, so the runner gets Xvfb, a real X
      # server with no screen, and the keyboard library winit loads at run
      # time (ADR-0027). No display is a failure too, not a skip.
      - name: Install a software Vulkan driver and a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers xvfb libxkbcommon-x11-0

      # STAGE: UNIT + INTEGRATION + DETERMINISM + SAVE TESTS
      # The determinism and save/load suites live alongside the units they
      # cover; the whole workspace runs as one gate.
      - name: Test
        run: xvfb-run -a -s "-screen 0 640x480x24" cargo test --workspace --all-targets

      - name: Documentation tests
        run: cargo test --workspace --doc

      # STAGE: BUILD
      - name: Build (release)
        run: cargo build --workspace --release

      # STAGE: SMOKE TEST
      # The native backend on the runner's software Vulkan: conformance, then
      # an upload and a draw, both read back from the device.
      - name: Smoke test the native RHI backend
        run: |
          ./target/release/nexora-rhi-probe | tee "${RUNNER_TEMP}/rhi-probe.txt"
          grep '^conformance        11/11 cases on wgpu$' "${RUNNER_TEMP}/rhi-probe.txt" > /dev/null
          grep '^draw               16 of 16 texels shaded by the GPU$' "${RUNNER_TEMP}/rhi-probe.txt" > /dev/null
          # ADR-0028: a sampled image, a depth test and a uniform, each read back.
          grep '^bound              256 of 256 texels sampled, 256 kept by depth, 256 tinted by a uniform$' \
            "${RUNNER_TEMP}/rhi-probe.txt" > /dev/null

      # The window host on Xvfb: a real X11 window, a Vulkan surface on it, the
      # conformance suite with presentation on, and 60 frames shown. The first
      # is read back from the surface image and must show the 16x16 target's
      # four quadrants in place: upside down or red-for-blue fails.
      - name: Smoke test the window host and presentation
        run: |
          xvfb-run -a -s "-screen 0 640x480x24" ./target/release/nexora-window-probe \
            | tee "${RUNNER_TEMP}/window-probe.txt"
          grep '^conformance        11/11 cases on wgpu, presenting$' "${RUNNER_TEMP}/window-probe.txt" > /dev/null
          grep '^frame              65536 of 65536 window texels show the 16x16 target, read back from the surface$' \
            "${RUNNER_TEMP}/window-probe.txt" > /dev/null
          grep '^presented          61 frames, 60 of them by the probe$' "${RUNNER_TEMP}/window-probe.txt" > /dev/null

      # Runs the Phase 0 vertical slice against the release binary and fails the
      # build if the world does not survive a save and reload.
      - name: Smoke test the headless vertical slice
        run: |
          # Memory is gated, unlike time: a pool's bytes are a property of the
          # data structures and come out the same on any runner (ADR-0024).
          ./target/release/nexora-headless --radius 2 --save "${RUNNER_TEMP}/ci-world.nxsv" \
            | tee "${RUNNER_TEMP}/ci-world.txt"
          grep '^memory             3 pools, worst nominal, 0 suspected leaks$' \
            "${RUNNER_TEMP}/ci-world.txt" > /dev/null
          # The RHI's null backend, held to the suite every backend must pass,
          # with no GPU initialized (ADR-0025). Its pool is the third above.
          grep '^rhi                null backend, conformance 11/11 cases, no GPU initialized$' \
            "${RUNNER_TEMP}/ci-world.txt" > /dev/null
          # And with the first visual generation's blocks: each of the sixteen
          # stones must register, show its own surface in a mesh, and survive
          # the save, the reload and the journal replay as a probe.
          ./target/release/nexora-headless --radius 2 --save "${RUNNER_TEMP}/ci-content.nxsv" \
            --content content/first-generation/blocks.json \
            | grep '^content blocks     16 (16 surfaces in the mesh)$' > /dev/null

      # The benchmark harness is code too: run a minimal pass so it cannot rot.
      # Deliberately NOT gated on timings - a shared runner's numbers would
      # produce false failures, and a performance gate that cries wolf gets
      # disabled. Real numbers come from a deliberate run on known hardware.
      - name: Smoke test the benchmark harness
        run: |
          ./target/release/nexora-benchmark --smoke \
            --scratch "${RUNNER_TEMP}/bench" > "${RUNNER_TEMP}/bench.txt"
          # Physics' published budget is judged in every run (DEBT-0013). Its
          # class is not gated: time, unlike memory, depends on the runner.
          grep '^published budgets (1):$' "${RUNNER_TEMP}/bench.txt" > /dev/null
          grep '^  physics.thousand_bodies_step  *median .* · [a-z]*, p95 .* · [a-z]*$' \
            "${RUNNER_TEMP}/bench.txt" > /dev/null
          # The RHI stage runs on the runner's software Vulkan (DEBT-0008). It
          # checks its own answers before timing, so a run that reaches the
          # table drew what it claims; the adapter is printed, never assumed.
          grep '^gpu adapter: .* (vulkan, cpu)$' "${RUNNER_TEMP}/bench.txt" > /dev/null
          grep '^rhi.draw_16 ' "${RUNNER_TEMP}/bench.txt" > /dev/null
          grep '^rhi.upload_first_generation ' "${RUNNER_TEMP}/bench.txt" > /dev/null
          # The camera stage (ADR-0029) checks its target lands mid-screen and
          # that culling keeps some columns and drops others before timing.
          grep '^camera.sample ' "${RUNNER_TEMP}/bench.txt" > /dev/null
          grep '^camera.visible_columns_r12 ' "${RUNNER_TEMP}/bench.txt" > /dev/null
          # Frame time: the first render pass draws the meshed 16³ region
          # through the camera; the frame matched a CPU ray cast before timing.
          grep '^frame.draw_chunk_16 ' "${RUNNER_TEMP}/bench.txt" > /dev/null
          grep '^frame.pixels_judged ' "${RUNNER_TEMP}/bench.txt" > /dev/null

      # The texture forge is code too, and its output is content: generate a
      # material from a checked-in definition, then read it back off disk and
      # validate it. A tool that writes something it cannot then read is the
      # failure this stage exists to catch.
      #
      # `grep PATTERN > /dev/null`, never `grep -q`: the runner's bash uses
      # `pipefail`, and `-q` closes the pipe at the first match, so a tool
      # that prints one more line dies of SIGPIPE and fails the step.
      #
      # Generation goes through the checked-in build plan, so CI builds exactly
      # the list the repository declares -- with the seed the plan owns.
      - name: Smoke test the texture forge
        run: |
          ./target/release/nexora-texture-forge build content/materials/plan.json \
            --out "${RUNNER_TEMP}/materials"
          ./target/release/nexora-texture-forge list --out "${RUNNER_TEMP}/materials"
          # Every PNG the tool writes, read back by a decoder that is not ours.
          # This matters more since the compressor started emitting dynamic
          # Huffman blocks: the encoder and the inflater in the same module
          # could agree on a misreading of RFC 1951 and every round-trip test
          # in the crate would still pass. `zlib` has not read this code.
          python3 - "${RUNNER_TEMP}/materials" <<'CHECK'
          import struct, sys, zlib
          from pathlib import Path

          checked = 0
          for path in sorted(Path(sys.argv[1]).rglob("*.png")):
              raw = path.read_bytes()
              assert raw[:8] == b"\x89PNG\r\n\x1a\n", f"{path}: not a PNG"
              at, idat, seen = 8, bytearray(), []
              while at < len(raw):
                  (length,) = struct.unpack(">I", raw[at : at + 4])
                  kind = raw[at + 4 : at + 8]
                  body = raw[at + 8 : at + 8 + length]
                  (stored,) = struct.unpack(">I", raw[at + 8 + length : at + 12 + length])
                  actual = zlib.crc32(kind + body) & 0xFFFFFFFF
                  assert stored == actual, f"{path}: {kind!r} chunk CRC {actual:08x} != {stored:08x}"
                  if kind == b"IDAT":
                      idat += body
                  seen.append(kind)
                  at += 12 + length
              assert seen[0] == b"IHDR" and seen[-1] == b"IEND", f"{path}: chunk order"
              width, height, depth, colour = struct.unpack(">IIBB", raw[16:26])
              channels = {0: 1, 2: 3, 4: 2, 6: 4}[colour]
              stride = width * channels * (depth // 8)
              filtered = zlib.decompress(bytes(idat))
              assert len(filtered) == height * (stride + 1), (
                  f"{path}: {len(filtered)} bytes is not {height} scanlines of {stride}"
              )
              for row in range(height):
                  kind = filtered[row * (stride + 1)]
                  assert 0 <= kind <= 4, f"{path}: row {row} has filter type {kind}"
              checked += 1
          print(f"{checked} PNGs decoded by zlib: chunk CRCs, IDAT stream and every filter byte")
          assert checked > 0, "no PNGs were checked"
          CHECK
          ./target/release/nexora-texture-forge validate nexora:material/stone_rough \
            --out "${RUNNER_TEMP}/materials"
          ./target/release/nexora-texture-forge validate nexora:material/dark_oak_plank \
            --out "${RUNNER_TEMP}/materials"
          # Generating again must change nothing: the run is deterministic, and
          # a second pass that rewrites files would mean it is not.
          ./target/release/nexora-texture-forge build content/materials/plan.json \
            --out "${RUNNER_TEMP}/materials" \
            | grep '^build .*: 0 written, [0-9]* unchanged, 0 replaced, 0 restored, 0 refused, 0 failed$' > /dev/null
          # And a single generate with the plan's seed must agree with the
          # build byte for byte: two paths to one material, one answer.
          ./target/release/nexora-texture-forge generate content/materials/stone_rough.json \
            --out "${RUNNER_TEMP}/materials" --seed 0xC0FFEE | grep '^unchanged' > /dev/null
          # And the same two properties for a whole manifest at once: every
          # entry produced on the first pass, nothing rewritten on the second.
          for manifest in content/manifests/*.json; do
            ./target/release/nexora-texture-forge batch "$manifest" \
              --out "${RUNNER_TEMP}/sets"
            ./target/release/nexora-texture-forge batch "$manifest" \
              --out "${RUNNER_TEMP}/sets" | grep '0 written' > /dev/null
          done
          # A repair must give back the exact bytes that were lost, not a new
          # map of the same shape: a restored normal that does not match the
          # albedo beside it is the failure this checks for. One file deleted,
          # one corrupted, and both compared by hash afterwards.
          granite="${RUNNER_TEMP}/sets/nexora/temperate_forest/granite"
          sha256sum "${granite}/normal.png" "${granite}/albedo.png" > "${RUNNER_TEMP}/before.sha"
          rm "${granite}/normal.png"
          printf 'not a png' > "${granite}/albedo.png"
          ./target/release/nexora-texture-forge repair \
            nexora:material/temperate_forest/granite --out "${RUNNER_TEMP}/sets"
          sha256sum --check --status "${RUNNER_TEMP}/before.sha"
          # And repairing something intact is a no-op, not a rewrite.
          ./target/release/nexora-texture-forge repair \
            nexora:material/temperate_forest/granite --out "${RUNNER_TEMP}/sets" | grep '^intact' > /dev/null
          # A lost preview is a lost file too, and comes back the same way.
          sha256sum "${granite}/preview.png" > "${RUNNER_TEMP}/preview.sha"
          rm "${granite}/preview.png"
          ./target/release/nexora-texture-forge repair \
            nexora:material/temperate_forest/granite --out "${RUNNER_TEMP}/sets"
          sha256sum --check --status "${RUNNER_TEMP}/preview.sha"
          # --no-preview writes the maps and nothing else.
          ./target/release/nexora-texture-forge batch \
            content/manifests/temperate_forest.json --out "${RUNNER_TEMP}/quiet" --no-preview
          test ! -e "${RUNNER_TEMP}/quiet/nexora/temperate_forest/granite/preview.png"
          test -e "${RUNNER_TEMP}/quiet/nexora/temperate_forest/granite/albedo.png"
          # A backend with no generator installed is refused by name, never
          # quietly served by the procedural one: a caller who asked for a
          # model and silently got noise would ship the noise. Exit 1 is "the
          # answer was no"; exit 2 is a name that is not a backend at all.
          ! ./target/release/nexora-texture-forge generate \
            content/materials/stone_rough.json --out "${RUNNER_TEMP}/never" --backend ai
          test ! -d "${RUNNER_TEMP}/never"
          # `|| status=$?` rather than `; test $?`: this step runs under
          # `bash -e`, so a bare failing command aborts before the next one
          # can inspect its code. A failure inside a `||` list does not.
          status=0
          ./target/release/nexora-texture-forge generate \
            content/materials/stone_rough.json --out "${RUNNER_TEMP}/never" \
            --backend nonsense || status=$?
          test "${status}" -eq 2
          # The first visual generation: 16x16, albedo only, every stone drawn
          # from its own recipe. The plan's policy refuses anything else,
          # and the byte-level check against CATALOG.md runs in `cargo test`.
          ./target/release/nexora-texture-forge build content/first-generation/plan.json \
            --out "${RUNNER_TEMP}/first-generation" --recipes content/recipes
          ./target/release/nexora-texture-forge validate nexora:material/stone/basalt \
            --out "${RUNNER_TEMP}/first-generation"
          # The build ends with the pipeline's INDEX stage: the runtime's view
          # of what was generated -- 16 textures and 16 materials.
          grep -q '"id": "nexora:texture/stone/basalt/albedo"' \
            "${RUNNER_TEMP}/first-generation/resources.json"
          ./target/release/nexora-texture-forge build content/first-generation/plan.json \
            --out "${RUNNER_TEMP}/first-generation" --recipes content/recipes \
            | grep '^build .*: 0 written, 16 unchanged, 0 replaced, 0 restored, 0 refused, 0 failed$' > /dev/null

      # The runtime reading what the forge wrote: every first-generation
      # block's texture resolved by identifier through the index the build
      # just wrote, hash-checked, and decoded with a 16x16 limit.
      - name: Smoke test the slice with the first generation's textures
        run: |
          ./target/release/nexora-headless --quiet --radius 1 --save "${RUNNER_TEMP}/ci-textures.nxsv" \
            --content content/first-generation/blocks.json \
            --resources "${RUNNER_TEMP}/first-generation" > "${RUNNER_TEMP}/ci-textures.txt"
          grep '^content textures   16 (resolved, verified and decoded)$' \
            "${RUNNER_TEMP}/ci-textures.txt" > /dev/null
          # The decoded textures are a fourth pool, and the cache that held them
          # must have given its bytes back when the stage ended -- as must the
          # RHI, which received all sixteen as RGBA8 in one submission.
          grep '^memory             4 pools, worst nominal, 0 suspected leaks$' \
            "${RUNNER_TEMP}/ci-textures.txt" > /dev/null
          grep '^rhi uploads        16 textures as RGBA8, 16384 bytes, one fence$' \
            "${RUNNER_TEMP}/ci-textures.txt" > /dev/null

      # The bridge to a real machine (docs/validation/local/): its rules are
      # checked here, and a committed report must be well formed and must
      # have come from a machine, not a container or a runner like this one.
      # Stale is not a failure -- it is what a report becomes -- so `check`
      # only fails on a malformed report.
      - name: Check the local validation bridge
        run: |
          python3 scripts/local-validation.py self-test
          python3 scripts/local-validation.py check --allow-missing

      # STAGE: CROSS-STACK CONFORMANCE
      # The C++ reference must agree with Rust on every digest before its
      # timings mean anything, so the agreement is checked on every push rather
      # than trusted from the day it was written. Timings are NOT gated here,
      # for the same reason the benchmark harness is not: a shared runner's
      # numbers would produce false failures. `--smoke` runs the full
      # conformance check and only a token pass of the timing loops.
      #
      # ubuntu-latest ships both g++ and clang++, so this also exercises the
      # two-compiler control that Appendix D exists because of.
      - name: Cross-stack conformance (Rust vs C++)
        run: ./scripts/compare-stacks.sh --smoke

      # A second run at a different worker count must produce an identical save.
      # Both layouts are checked: the single container, and the region store the
      # same run writes beside it (ADR-0014). A region file is deflated on its
      # own, so the store is the stricter of the two - nine independent streams
      # that all have to come out the same.
      - name: Determinism smoke test
        run: |
          ./target/release/nexora-headless --quiet --seed 987654321 --threads 1 \
            --save "${RUNNER_TEMP}/det-a.nxsv"
          ./target/release/nexora-headless --quiet --seed 987654321 --threads 8 \
            --save "${RUNNER_TEMP}/det-b.nxsv"
          cmp "${RUNNER_TEMP}/det-a.nxsv" "${RUNNER_TEMP}/det-b.nxsv"
          diff -r "${RUNNER_TEMP}/det-a-regions" "${RUNNER_TEMP}/det-b-regions"
          ./target/release/nexora-headless --quiet --seed 987654321 --threads 1 \
            --content content/first-generation/blocks.json --save "${RUNNER_TEMP}/det-c.nxsv"
          ./target/release/nexora-headless --quiet --seed 987654321 --threads 8 \
            --content content/first-generation/blocks.json --save "${RUNNER_TEMP}/det-d.nxsv"
          cmp "${RUNNER_TEMP}/det-c.nxsv" "${RUNNER_TEMP}/det-d.nxsv"

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The operator's path, on the operator's platforms. `local-validation.py run`
  # is what someone runs on a real machine to produce evidence
  # (docs/validation/local/), and the container this repository is developed
  # in is Linux: this is where "it works on Windows and macOS" is checked
  # before anyone is asked to run it there. The report goes to the runner's
  # temp directory -- a runner is not local hardware, and the script refuses
  # to treat it as such.
  platforms:
    name: operator path on ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            runner: windows-latest
            python: python
          - label: macos
            runner: macos-latest
            python: python3
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: platforms-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock') }}

      # The full report runs the test suite; nothing else runs it off Linux.
      - name: Test on this platform
        run: cargo test --workspace --all-targets

      - name: Run the local validation script, quick mode
        shell: bash
        run: |
          ${{ matrix.python }} scripts/local-validation.py self-test
          ${{ matrix.python }} scripts/local-validation.py run --quick \
            --out "${RUNNER_TEMP}/local-validation"
          cat "${RUNNER_TEMP}/local-validation/NEXORA-LOCAL-VALIDATION.md"
